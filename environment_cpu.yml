name: rl_env
channels:
  - conda-forge
dependencies:
  - python=3.12 # gym-pybullet-drones requires >=3.12,<4.0
  - pip

  # Pinned <82: gym-pybullet-drones still imports pkg_resources,
  # which setuptools>=82 removed. Unpin when upstream drops it.
  - setuptools<82

  - pybullet=3.25 # pinned to match environment.yml (GPU) for consistent physics behavior
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - tqdm
  - tensorboard
  - pip:
      # CPU-only build — no NVIDIA GPU on this machine.
      # For CUDA, see environment.yml.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - torchaudio

      - gymnasium>=1.3,<2.0 # gym-pybullet-drones needs >=1.3; SB3 2.9.0 allows up to <2.0
      - stable-baselines3[extra]==2.9.0
      - git+https://github.com/learnsyslab/gym-pybullet-drones.git
      - huggingface_hub
      - safetensors
      - wandb
