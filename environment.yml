name: rl_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - setuptools<82 # gym-pybullet-drones still imports pkg_resources
  - pybullet=3.25 # conda-forge wheel for Py3.12 — no source build
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - tqdm
  - tensorboard
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - torchaudio
      - gymnasium>=1.3,<2.0 # gym-pybullet-drones 2.2.0 needs >=1.3; SB3 2.9.0 allows up to <2.0
      - stable-baselines3[extra]==2.9.0
      - git+https://github.com/learnsyslab/gym-pybullet-drones.git
      - huggingface_hub
      - safetensors
      - wandb
