name: rl_env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pyyaml
  - tqdm
  - tensorboard
  - pip:
      # --- PyTorch (CUDA 12.6 wheels; compatible with driver 595.x / CUDA 13.2) ---
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - torchvision
      - torchaudio

      # --- RL stack ---
      - gymnasium
      - stable-baselines3[extra]

      # --- Active track: gym-pybullet-drones (physics sim, no PX4/network) ---
      # pybullet itself compiles from source on install — needs a C compiler.
      # On Ubuntu: `sudo apt install build-essential` before creating this env
      # if pip install fails on the pybullet wheel build.
      - git+https://github.com/learnsyslab/gym-pybullet-drones.git

      # --- PARKED: PX4/MAVSDK comms, for the later SITL transplant phase ---
      - mavsdk

      # --- Hugging Face (upload trained model) ---
      - huggingface_hub
      - safetensors

      # --- Optional: only if you're also logging experiments ---
      - wandb